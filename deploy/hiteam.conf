server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 191.40.41.14 _;

    root /var/www/hiteam;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://hiteam.xyz$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hiteam.xyz www.hiteam.xyz;
    root /var/www/hiteam;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://hiteam.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hiteam.xyz;

    ssl_certificate /etc/letsencrypt/live/hiteam.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiteam.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://hiteam.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hiteam.xyz;

    ssl_certificate /etc/letsencrypt/live/hiteam.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiteam.xyz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HiTeamSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hiteam;
    index index.html;
    client_max_body_size 2m;

    include /etc/hiteam/security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/hiteam/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 0;
        add_header Cache-Control "no-cache";
        include /etc/hiteam/security-headers.conf;
        try_files $uri =404;
    }
}
